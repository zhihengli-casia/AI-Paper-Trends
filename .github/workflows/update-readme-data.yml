name: Update README data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docs/results/**/*.csv"
      - "docs/visuals/**/*.csv"
      - "src/update_readme_data.py"

permissions:
  contents: write

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Regenerate README tables
        run: python src/update_readme_data.py
      - name: Commit README updates
        run: |
          if git diff --quiet README.md README_cn.md; then
            echo "README data is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README_cn.md
          git commit -m "Auto-update README data"
          git push
